apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smartai-service-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: smartai-app
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /
      interval: 15s
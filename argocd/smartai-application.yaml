apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartai-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/oluyemmy/SmartAI.git
    targetRevision: juwon/devop
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true